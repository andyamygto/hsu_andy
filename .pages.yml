# Pages CMS (https://app.pagescms.org): edit this site in the browser.

media:
  input: static/uploads
  output: /uploads
  categories: [image, document]

settings:
  content:
    merge: true

content:
  - name: profile
    label: Profile
    type: file
    path: data/profile.yaml
    fields:
      - { name: name, label: Name, type: string }
      - { name: tagline, label: Line under your name, type: string }
      - { name: position, label: Positions (one per line), type: text }
      - { name: photo, label: Photo, description: A square image works best. Clear it to hide the photo., type: image }
      - { name: email, label: Email, type: string }
      - { name: scholar, label: Google Scholar URL, type: string }
      - { name: orcid, label: ORCID URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - name: cv
        label: CV (PDF)
        description: Once uploaded, a CV link appears in the menu and on the home page.
        type: file

  - name: home
    label: Home intro
    type: file
    path: content/_index.md
    fields:
      - { name: title, type: string, hidden: true }
      - name: body
        label: Introduction on the home page
        type: code
        options: { format: markdown }

  - name: research
    label: Research
    description: The Research section of the home page. Do not change a theme key; papers and notes are grouped by it.
    type: file
    path: data/research.yaml
    fields:
      - { name: heading, label: Heading, type: string }
      - { name: subheading, label: Subheading, type: string }
      - name: themes
        label: Themes
        type: object
        list: true
        fields:
          - { name: key, label: "Key (category code, do not change)", type: string, required: true }
          - { name: title, label: Title, type: string, required: true }
          - name: place
            label: Where it appears
            type: select
            options:
              values:
                - { value: main, label: "Main theme (01, 02, 03 …)" }
                - { value: methods, label: "Methods column" }
                - { value: earlier, label: "Earlier work (lower part of the home page)" }
          - { name: points, label: Key points, type: string, list: true }
          - { name: image, label: Figure, type: image }
          - { name: caption, label: Caption, type: string }
      - name: highlights
        label: Selected impact
        description: "Shown in the Selected impact column. Links: [text](URL)."
        type: string
        list: true

  - name: publications
    label: Publications
    type: file
    path: data/publications.yaml
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: authors
        label: Authors
        description: "In the order of the paper. C.-E. Hsu is set in bold automatically."
        type: string
      - { name: venue, label: "Journal, volume, page (or arXiv preprint)", type: string }
      - { name: year, label: Year, type: number }
      - { name: doi, label: "DOI (just 10.xxxx/…)", type: string }
      - { name: arxiv, label: "arXiv ID (e.g. 2411.07427)", type: string }
      - { name: note, label: "Note (e.g. co-first author)", type: string }
      - name: category
        label: Category
        type: select
        options:
          values:
            - { value: moire, label: Correlated excitons in moiré TMDs }
            - { value: tunable, label: Tunable excitons in quantum materials }
            - { value: ultrafast, label: Ultrafast nonlinear optics }
            - { value: methods, label: Methods and large-scale computing }
            - { value: earlier, label: "Electron–phonon, CDW, 2D materials" }


  - name: notes
    label: Notes
    type: collection
    path: content/notes
    filename: "{fields.slug}/index.md"
    exclude: [_index.md]
    view:
      node: index.md
      fields: [title, topic, date, draft]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: slug
        label: URL name
        description: "Lowercase letters, digits and -, e.g. gw-plasmon-pole. Do not change it later."
        type: string
        required: true
        pattern: { regex: "^[a-z0-9][a-z0-9-]*$", message: "Use only lowercase letters, digits and -" }
      - { name: date, label: Date, type: date }
      - name: topic
        label: Category
        description: The Notes page is grouped by this.
        type: select
        options:
          values:
            - { value: moire, label: Correlated excitons in moiré TMDs }
            - { value: tunable, label: Tunable excitons in quantum materials }
            - { value: ultrafast, label: Ultrafast nonlinear optics }
            - { value: methods, label: Methods and large-scale computing }
            - { value: earlier, label: "Electron–phonon, CDW, 2D materials" }

      - { name: tags, label: Tags, type: string, list: true }
      - name: draft
        label: Draft
        description: Hidden from the site while checked (the source file is still visible on GitHub).
        type: boolean
        default: true
      - name: body
        label: Text
        description: "Markdown. Math: $...$ or $$...$$. Blocks: > [!def] Title."
        type: code
        options: { format: markdown }
      - name: figures
        label: Figures
        description: Shown in order at the end. To place one in the text, write ![caption](file-name) there.
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - name: attachments
        label: Attachments
        description: PDFs and other files, listed at the end. With no text, the PDF is shown on the page.
        type: file
        list: true

  - name: posts
    label: Posts
    type: collection
    path: content/posts
    filename: "{fields.slug}/index.md"
    exclude: [_index.md]
    view:
      node: index.md
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: slug
        label: URL name
        description: "Lowercase letters, digits and -. Do not change it later."
        type: string
        required: true
        pattern: { regex: "^[a-z0-9][a-z0-9-]*$", message: "Use only lowercase letters, digits and -" }
      - { name: date, label: Date, type: date }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: draft, label: Draft, type: boolean, default: true }
      - { name: body, label: Text, type: code, options: { format: markdown } }
      - name: figures
        label: Figures
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image }
          - { name: caption, label: Caption, type: string }
      - { name: attachments, label: Attachments, type: file, list: true }

  - name: about
    label: About page
    type: file
    path: content/about.md
    fields:
      - { name: title, type: string, hidden: true }
      - { name: body, label: Text, type: code, options: { format: markdown } }
